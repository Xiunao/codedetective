<script>
const DEFAULT_RELAY = "https://cd-relay.z17832688.workers.dev/";

/* ============ 内置验真卡库 ============ */
const DATA=[
 {
  id:"react",
  detect:["ReactDOM.render","react-dom"],
  t:"React 19 移除了 ReactDOM.render",
  v:"已确认废弃",
  lv:"red",
  code:`<span class="del">- import ReactDOM from 'react-dom';</span> <span class="del">- ReactDOM.render(<App/>, document.getElementById('root'));</span> <span class="add">+ import { createRoot } from 'react-dom/client';</span> <span class="add">+ const root = createRoot(document.getElementById('root'));</span> <span class="add">+ root.render(<App/>);</span>`,
  body:"ReactDOM.render 早在 2022 年 v18.0.0 就标记废弃，<b>React 19 已正式移除</b>。React 官方给出迁移方式与 codemod 命令。同批被移除的还有 ReactDOM.hydrate、unmountComponentAtNode、findDOMNode。",
  srcs:[["React 19 官方升级指南 · Removed: ReactDOM.render","https://react.dev/blog/2024/04/25/react-19-upgrade-guide"],["React 官方中文站","https://zh-hans.react.dev/"]],
  q:"ReactDOM.render 在 React 19 还能用吗",
  s:"置信度 98%"
 },
 {
  id:"tailwind",
  detect:["tailwind.config","@tailwind","theme.extend","tailwindcss"],
  t:"Tailwind v4 已删除 tailwind.config.js",
  v:"版本陷阱",
  lv:"amber",
  code:`<span class="del">- @tailwind base; @tailwind components; @tailwind utilities;</span> <span class="add">+ @import "tailwindcss";</span>

<span class="del">- // tailwind.config.js
 theme:{extend:{colors:{brand:'#b91c1c'}}}</span>
<span class="add">+ @theme { --color-brand: #b91c1c; }</span>`,
  body:"Tailwind v4 是彻底重写（Rust 引擎 Oxide），采用 <b>CSS-first 配置</b>：配置文件整体删除，主题改写在 CSS 的 <code>@theme</code> 里。大量 AI 仍会输出 v3 写法，且 v4 还改了一批工具类名（shadow→shadow-sm、blur→blur-sm、rounded→rounded-sm、outline-none→outline-hidden）。",
  srcs:[["Tailwind 官方升级指南","https://tailwindcss.com/docs/upgrade-guide"],["Tailwind v4 迁移实战（社区）","https://codolve.com/blog/complete-guide-tailwind-css-v4"]],
  q:"Tailwind CSS v4 还需要 tailwind.config.js 吗",
  s:"置信度 96%"
 },
 {
  id:"npm",
  detect:["npm i ","npm install","import ","require("],
  t:'AI 常编造 npm 包名："unused-imports"',
  v:"高危 · 供应链风险",
  lv:"red",
  code:`<span class="del">- npm i unused-imports        // 不存在（真实包：eslint-plugin-unused-imports）</span>
<span class="del">- npm i react-codeshift       // 2026年1月被抢注，勿装</span>
<span class="add">+ npm i -D eslint-plugin-unused-imports</span>`,
  body:"这是 AI 编程最危险的一类幻觉：模型编出一个<b>听起来合理但从未存在</b>的包名，攻击者抢注同名包并植入 postinstall 脚本，下一次 <code>npm install</code> 就把恶意代码拉进构建。这类攻击叫 <b>slopsquatting</b>。研究显示：AI 推荐的包名约 <b>19.7%</b> 不存在，同一提示重复运行时 <b>43%</b> 会吐出同一个幻觉名。",
  srcs:[["vetpkg · 专门拦截 AI 幻觉包的 npm 工具","https://www.npmjs.com/package/vetpkg"],["AI Hallucinated Imports 案例分析","https://vibedoctor.io/blog/hallucinated-imports-ai-packages-dont-exist"]],
  q:"AI 生成的 npm 包名不存在 slopsquatting",
  s:"置信度 95%"
 }
];

/* ---- 代码 → 卡片 规则匹配 ---- */
function matchCard(code){
  const c=code.toLowerCase();
  for(const d of DATA){
    if(d.detect.some(k=>c.includes(k.toLowerCase()))){ return d; }
  }
  return null;
}

/* ---- 渲染卡片 ---- */
function renderCard(d, opts={}){
  const tag = opts.auto
    ? '<div class="verdict" style="background:rgba(34,211,238,.15);color:var(--cyan);border-color:rgba(34,211,238,.35)">🎯 自动匹配 · 预置查证库</div>'
    : '';
  return `
 <div class="card ${d.lv}">
  <div class="chead"><div class="light"></div><div>
    <div class="ctitle">${d.t}</div>
    <div class="verdict">${d.v}</div>${tag}</div></div>
  <div class="label">修正前后</div><pre>${d.code}</pre>
  <div class="label">查证结论</div><div class="body">${d.body}</div>
  <div class="label">来源（可点开核对）</div>
  ${d.srcs.map(s=>`<a class="src" href="${s[1]}" target="_blank" rel="noopener">↗ ${s[0]}</a>`).join("")}
  <div class="label">检索式</div><div class="body" style="font-size:12px">"${d.q}"</div>
  <div class="meta"><span>CodeDetective 预置库</span><span>${opts.live?'实时+预置双核':'离线可演示'}</span><span class="score">${d.s}</span></div>
  <div class="tools">
    <button onclick="copyCardById('${d.id}')">复制这张验真卡</button>
  </div>
 </div>`;
}

let cur=0;
function render(){
 document.getElementById('cards').innerHTML=renderCard(DATA[cur]);
}
function pick(i,el){
 cur=i; render();
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
 if(el) el.classList.add('on');
}
function toast(m){
 const t=document.getElementById('toast');
 t.textContent=m; t.classList.add('on');
 setTimeout(()=>t.classList.remove('on'),1800);
}
function copyCardById(id){
 const d=id? DATA.find(x=>x.id===id) : DATA[cur];
 if(!d){return;}
 const txt=`【CodeDetective 验真卡】 ${d.t}
判定：${d.v}

${d.body.replace(/<[^>]+>/g,'')}

来源：
${d.srcs.map(s=>`- ${s[0]}
   ${s[1]}`).join("\n")}

${d.s} · 由 CodeDetective 查证库生成`;
 navigator.clipboard?.writeText(txt).then(()=>toast("验真卡已复制"),()=>toast("复制失败"));
}
function copyCard(){ copyCardById(DATA[cur].id); }

/* ============ 融合版 run() ============ */
async function run(){
  const code=document.getElementById('code').value.trim();
  const key=document.getElementById('key').value.trim();
  const btn=document.querySelector('button[onclick="run()"]');

  if(!code){toast("先贴一段代码");return;}

  btn.disabled=true;
  btn.textContent="验真中…";

  // ★ 第一步：先秒出匹配卡（继承方案B，离线也能演示）
  const matched=matchCard(code);
  const box=document.getElementById('cards');
  let live=document.getElementById('liveResult');
  if(live) live.remove();

  if(matched){
    const old=document.getElementById('autoCard');
    if(old) old.remove();
    box.insertAdjacentHTML('beforebegin',
      `<div id="autoCard">${renderCard(matched,{auto:true})}</div>`);
    toast("🎯 已自动匹配："+matched.t);
  }

  // ★ 第二步：没填 Key → 停在匹配卡，不报错
  if(!key){
    btn.disabled=false; btn.textContent="开始验真";
    const anchor=document.getElementById('autoCard')||box;
    anchor.scrollIntoView({behavior:'smooth'});
    return;
  }

  // ★ 第三步：填了 Key → 后台实时检索（长代码截断 + Pages 二次解析 + 501/超时兜底，全部保留）
  toast(matched?"匹配卡已出 · 正在用元宝补充实时来源…":"正在通过中转调用元宝搜索…");

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);

  try{
    const r=await fetch(DEFAULT_RELAY,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        code: code.length>500 ? code.slice(0,500)+"...(已截断)" : code,
        apiKey:key
      }),
      signal:controller.signal
    });
    clearTimeout(timer);

    const j=await r.json().catch(()=>null);
    if(!r.ok || !j){
      let errMsg="实时检索失败，已为你展示预置查证卡";
      if(r.status===401||r.status===403) errMsg="Key 无效或无权限，已展示预置查证卡";
      else if(r.status===501) errMsg="Worker 未更新，请确认已 Deploy";
      else if(r.status===405) errMsg="请求被拒，请确认 Worker 已更新";
      else if(j && j.error) errMsg=j.error;
      else errMsg="HTTP "+r.status;
      throw new Error(errMsg);
    }

    // 腾讯云 Pages 是 JSON 字符串数组，需二次 parse
    let pages=j?.Response?.Pages||[];
    pages=pages.map(p=>{ if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return null}} return p; }).filter(Boolean);
    if(!pages.length) throw new Error("元宝返回为空，请检查 Key 权限或代码是否有效");

    live=document.createElement('div');
    live.id='liveResult';
    live.innerHTML=`
    <div class="card green" style="border-color:rgba(34,197,94,.5)">
     <div class="chead"><div class="light"></div><div>
      <div class="ctitle">🔎 元宝实时检索补充（${matched?'与上方匹配卡交叉验证':'独立结果'}）</div>
      <div class="verdict">真实调用成功</div>
     </div></div>
     <div class="label">检索式</div>
     <div class="body" style="font-size:12px">"${code.slice(0,80).replace(/"/g,'')}…"</div>
     <div class="label">实时来源（可点开核对）</div>
     ${pages.slice(0,5).map(p=>`
      <div class="src">🌐 ${p.site||'未知站点'}${p.url?' · <a href="${p.url}" target="_blank" rel="noopener" style="color:#22d3ee">打开原文</a>':''}</div>
      <div class="body" style="font-size:12px;margin-bottom:8px">${(p.passage||'').slice(0,350)}</div>
     `).join('')}
     <div class="meta"><span>元宝搜索 API</span><span>SearchPro</span><span class="score">${pages.length} 条来源</span></div>
    </div>`;

    const anchor=document.getElementById('autoCard')||box;
    anchor.parentNode.insertBefore(live,anchor.nextSibling);
    toast("✅ 实时来源 "+pages.length+" 条，已与查证卡对照");
    live.scrollIntoView({behavior:'smooth'});

  }catch(e){
    clearTimeout(timer);
    // 实时挂了也不崩：匹配卡还在，失败信息轻量提示
    const msg=e.name==='AbortError' ? "实时检索超时（15秒），预置查证卡仍可用" : e.message;
    toast(msg);
    // 失败时也插一张小红卡，说明回落
    live=document.createElement('div');
    live.id='liveResult';
    live.innerHTML=`
    <div class="card red" style="border-color:rgba(239,68,68,.4)">
     <div class="chead"><div class="light"></div><div>
      <div class="ctitle">⚠️ 实时检索未拿到结果</div>
      <div class="verdict">已回落到预置查证卡</div></div></div>
     <div class="body" style="font-size:12px">${msg}</div>
     <div class="hint" style="margin-top:8px;font-size:11px;color:var(--dim)">排查：① Key 是否以 sk- 开头且有效 ② Worker 是否已 Deploy ③ 当前网络能否访问 Cloudflare</div>
    </div>`;
    const anchor=document.getElementById('autoCard')||box;
    anchor.parentNode.insertBefore(live,anchor.nextSibling);
  }finally{
    clearTimeout(timer);
    btn.disabled=false;
    btn.textContent="开始验真";
  }
}

render();
</script>
</body>
</html>
